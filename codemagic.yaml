workflows:
  ios-build:
    name: iOS Build - 红豆佳缘
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        XCODE_WORKSPACE: "hongdou/hongdou.xcworkspace"
        XCODE_SCHEME: "hongdou"
        BUNDLE_ID: "com.hongdou.wuyu"
      # 需要替换成你自己的 Apple Store Connect API 密钥
      # APP_STORE_CONNECT_ISSUER_ID: "你的ISSUER_ID"
      # APP_STORE_CONNECT_KEY_IDENTIFIER: "你的KEY_ID"
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd hongdou
          pod install

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create

      - name: Use system default keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd hongdou
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - 364286393@qq.com
        notify:
          success: true
          failure: true
