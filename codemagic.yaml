workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        # 璇佷功鍜屾弿杩版枃浠堕渶瑕佸湪 Codemagic 涓厤缃?
        # 1. 鎵撳紑 https://codemagic.io/teams/YOUR_TEAM/settings/secrets
        # 2. 娣诲姞浠ヤ笅鏂囦欢锛?
        #    - CM_CERTIFICATE: 涓婁紶浣犵殑 .p12 璇佷功
        #    - CM_CERTIFICATE_PASSWORD: p12 璇佷功鐨勫瘑鐮?
        #    - CM_PROVISIONING_PROFILE: 涓婁紶 .mobileprovision 鎻忚堪鏂囦欢
        - ios_certs
      vars:
        XCODE_WORKSPACE: "PartTimeJobs.xcworkspace"
        XCODE_SCHEME: "PartTimeJobs"
        BUNDLE_ID: "com.student.PartTimeJobs"
        APP_STORE_APP_ID: 1234567890
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      
      - name: Fetch signing files
        script: |
          # 杩欓噷浼氳嚜鍔ㄤ娇鐢ㄤ綘鍦?Codemagic 涓厤缃殑璇佷功鍜屾弿杩版枃浠?
          # 闇€瑕佸厛鍦?Environment variables 涓缃細
          # - CM_CERTIFICATE (base64 缂栫爜鐨?.p12 鏂囦欢)
          # - CM_CERTIFICATE_PASSWORD
          # - CM_PROVISIONING_PROFILE (base64 缂栫爜鐨?.mobileprovision 鏂囦欢)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      
      - name: Use system default keychain
        script: |
          keychain add-certificates
      
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      
      - name: Install CocoaPods dependencies
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          pod install
      
      - name: Build IPA
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # 涓婁紶鍒拌挷鍏嫳
      scripts:
        - name: Upload to Pgyer
          script: |
            # 闇€瑕佽缃?PGYER_API_KEY 鐜鍙橀噺
            # 鍦?Codemagic 涓坊鍔狅細PGYER_API_KEY (钂插叕鑻辩殑 API Key)
            if [ -n "$PGYER_API_KEY" ]; then
              IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
              if [ -f "$IPA_PATH" ]; then
                echo "Uploading to Pgyer..."
                curl -F "file=@$IPA_PATH" \
                     -F "_api_key=$PGYER_API_KEY" \
                     -F "buildUpdateDescription=Build from Codemagic" \
                     https://www.pgyer.com/apiv2/app/upload
              fi
            else
              echo "PGYER_API_KEY not set, skipping upload to Pgyer"
            fi
      email:
        recipients:
          - 364286393@qq.com
        notify:
          success: true
          failure: true
