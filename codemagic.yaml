workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      # App Store Connect API Key 璁剧疆
      # 鍦?Environment variables 涓缃互涓嬪彉閲忥細
      # APP_STORE_CONNECT_ISSUER_ID
      # APP_STORE_CONNECT_KEY_IDENTIFIER  
      # APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        XCODE_WORKSPACE: "PartTimeJobs.xcworkspace"
        XCODE_SCHEME: "PartTimeJobs"
        BUNDLE_ID: "com.student.PartTimeJobs"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      
      - name: Fetch signing files
        script: |
          # 浣跨敤鐜鍙橀噺鑷姩绛惧悕
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 -d)"
      
      - name: Use system default keychain
        script: |
          keychain add-certificates
      
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      
      - name: Install CocoaPods dependencies
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          pod install
      
      - name: Build IPA
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - 364286393@qq.com
        notify:
          success: true
          failure: true
