workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        XCODE_WORKSPACE: "PartTimeJobs.xcworkspace"
        XCODE_SCHEME: "PartTimeJobs"
        BUNDLE_ID: "com.student.PartTimeJobs"
        APP_STORE_CONNECT_ISSUER_ID: "5ebaff43-62d2-4645-8e59-1714ad9794f5"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "NBP7P7363K"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgyew60C7FQ/ZK4eeT
          TU4RWcrw9Fs7o6CX/uUwbxngvrOgCgYIKoZIzj0DAQehRANCAASLC9+5Ax30gtUR
          9yofbPbKQDbKa03I/+2VpXfSvv6WQQQqpZkLPwTR2U+clpfVjesHkuwK4vehQsg4
          4GpC276P
          -----END PRIVATE KEY-----
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      
      - name: Fetch signing files
        script: |
          echo $APP_STORE_CONNECT_PRIVATE_KEY > /tmp/authkey.p8
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      
      - name: Use system default keychain
        script: |
          keychain add-certificates
      
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      
      - name: Install CocoaPods dependencies
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          pod install
      
      - name: Build IPA
        script: |
          cd "PartTimeJobs_10-24-1-20 鏈€鏂?
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - 364286393@qq.com
        notify:
          success: true
          failure: true
