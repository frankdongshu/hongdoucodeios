workflows:
  ios-build:
    name: iOS Build - 红豆佳缘
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        XCODE_WORKSPACE: "hongdou/hongdou.xcworkspace"
        XCODE_SCHEME: "hongdou"
        BUNDLE_ID: "com.hongdou.wuyu"
        APP_STORE_CONNECT_ISSUER_ID: "5ebaff43-62d2-4645-8e59-1714ad9794f5"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "NBP7P7363K"
    scripts:
      - name: Setup API key file
        script: |
          set -e
          mkdir -p ~/private_keys
          echo "" \
            | base64 -d > ~/private_keys/AuthKey_NBP7P7363K.p8
          chmod 600 ~/private_keys/AuthKey_NBP7P7363K.p8
          echo "API key file created"

      - name: Install CocoaPods dependencies
        script: |
          cd hongdou
          pod install

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create

      - name: Use system default keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd hongdou
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - 364286393@qq.com
        notify:
          success: true
          failure: true
